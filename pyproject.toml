[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-pairs"
version = "0.1.0"
description = "Pairs trading / statistical-arbitrage engine for the trade-suite: cointegration screening, hedge ratios, z-score spread signals, spread backtesting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "crieck2010" }]
keywords = ["trading", "pairs-trading", "statistical-arbitrage", "cointegration", "finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
trade-pairs = "trade_pairs.cli:main"

[project.urls]
Homepage = "https://github.com/crieck2010/trade-pairs"
Repository = "https://github.com/crieck2010/trade-pairs"

[tool.setuptools.packages.find]
where = ["src"]
